name: Build Unity Android & Enviar Telegram

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Conversor (Este Repo)
        uses: actions/checkout@v4

      - name: Baixar Jogo Original do GitHub (DCGO2)
        run: git clone https://github.com/DCGO2/DCGO.git UnityProject

      - name: Aplicar Patches de Correção para Android
        shell: pwsh
        run: ./Engine-Patch.ps1 -ProjectPath ./UnityProject

      - name: Commitar Patches Localmente
        run: |
          cd UnityProject
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Applied Android Patches"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Library-Android

      - name: Compilar Jogo Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          targetPlatform: Android
          buildName: DCGO
          buildsPath: build
          versioning: None

      - name: Enviar APK para o Telegram
        uses: appleboy/telegram-action@master
        if: success()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          document: build/Android/DCGO.apk
          message: "🚀 Nova versão do DCGO compilada nas nuvens do GitHub e pronta para jogar!"
